name: Bug report
description: Something in CompBot isn't working as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: command
    attributes:
      label: Command
      description: Which command were you using? (for example SLL, ILL)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we make it happen again?
      placeholder: |
        1. Open...
        2. Run...
        3. See...
  - type: input
    id: versions
    attributes:
      label: CompBot and Excel versions
      placeholder: "CompBot v..., Excel 365 (Windows)"
